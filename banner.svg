<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Sara Sadr Jahani — AI / NLP Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F3E56"/><stop offset="1" stop-color="#44688F"/>
    </linearGradient>
    <clipPath id="c"><rect width="1000" height="240" rx="14"/></clipPath>
  </defs>
  <style>
    text{font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif}
    .name{font-size:50px;font-weight:700;fill:#F8FAFB;letter-spacing:.5px}
    .role{font-size:25px;font-weight:500;fill:#C5D6E6}
    .w1,.w2,.w3{fill:none;stroke-linecap:round}
    .w1{stroke:#7AA2C4;stroke-width:2;opacity:.55;animation:drift 14s linear infinite}
    .w2{stroke:#A8CAC8;stroke-width:2;opacity:.40;animation:drift 20s linear infinite reverse}
    .w3{stroke:#A9C7EE;stroke-width:1.5;opacity:.30;animation:drift 28s linear infinite}
    @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-250px)}}
    .r1,.r2,.r3{opacity:0;animation:cycle 9s infinite}
    .r1{opacity:1}
    .r1{animation-delay:0s} .r2{animation-delay:3s} .r3{animation-delay:6s}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}6%,30%{opacity:1;transform:translateY(0)}36%,100%{opacity:0;transform:translateY(-6px)}}
    .intro{animation:fade 1.2s ease-out both}
    @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important} .r1{opacity:1}}
  </style>
  <g clip-path="url(#c)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <path class="w1" d="M-250 204 q62.5 -28 125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 "/>
    <path class="w2" d="M-250 220 q62.5 -20 125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 "/>
    <path class="w3" d="M-250 188 q62.5 -16 125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 "/>
    <g class="intro">
      <text class="name" x="56" y="108">Sara Sadr Jahani</text>
      <g transform="translate(56,152)">
        <text class="role r1">AI / NLP Engineer</text>
        <text class="role r2">RAG systems &amp; LLM agents</text>
        <text class="role r3">Graph-backed retrieval with Neo4j</text>
      </g>
    </g>
  </g>
